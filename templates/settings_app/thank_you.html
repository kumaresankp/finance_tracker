{% extends 'base.html' %}
{% block title %}Thank You{% endblock %}
{% block page_title %}Thank You{% endblock %}
{% block content %}
<div class="container">
  <div class="card text-center">
    <div class="card-body">
      <i class="bi bi-check-circle text-success" style="font-size:48px"></i>
      <h3 class="mt-3">Thank you!</h3>
      <p class="text-muted">We'll get back to you soon.</p>
      <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary mt-2">Return Home</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof gtag === 'function') {
        gtag('event', 'conversion', {
            'send_to': 'AW-18247916559/suVRCM_x0NMcEI-4pP1D',
            'value': 1.0,
            'currency': 'INR'
        });
    } else {
        console.warn('gtag not loaded');
    }
});
</script>
{% endblock %}
  {% if google_ads_send_to %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      try {
        if (typeof gtag === 'function') {
          gtag('event', 'conversion', { 'send_to': '{{ google_ads_send_to }}' });
        } else {
          console.warn('gtag not available — Google Ads conversion not sent');
        }
      } catch (e) {
        console.error('Conversion tracking error', e);
      }
    });
  </script>
  {% endif %}
{% endblock %}
